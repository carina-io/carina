# Only what the built-in system:kube-scheduler and system:volume-scheduler roles (bound below) don't grant
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: carina-scheduler-clusterrole
rules:
  # system:kube-scheduler only allows updating the lease named kube-scheduler
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Scheduler writes its scheduling decisions on the standard k8s object, only carina controller and node deployments write there
  - apiGroups: ["carina.storage.io"]
    resources: ["logicvolumes", "nodestorageresources"]
    verbs: ["get", "list", "watch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: carina-scheduler-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: carina-scheduler-clusterrole
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.scheduler }}
    namespace: {{ .Release.Namespace }}

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: carina-scheduler-as-kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.scheduler }}
    namespace: {{ .Release.Namespace }}

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: carina-scheduler-as-volume-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.scheduler }}
    namespace: {{ .Release.Namespace }}
